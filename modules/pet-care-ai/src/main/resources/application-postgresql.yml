spring:
  ai:
    vectorstore:
      type: pgvector
      pgvector:
        schema-name: petcare
        table-name: vector_store
        dimensions: 1024
        distance-type: COSINE_DISTANCE
        index-type: HNSW
        initialize-schema: false
        schema-validation: true
  flyway:
    enabled: false

petcare:
  telemetry:
    store: postgresql
  search:
    content-backend: postgresql

mybatis-flex:
  datasource:
    ai:
      url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:petcare}?currentSchema=petcare
      username: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      driver-class-name: org.postgresql.Driver
      maximum-pool-size: 5
      minimum-idle: 1
    core:
      url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:petcare}?currentSchema=petcare
      username: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      driver-class-name: org.postgresql.Driver
      maximum-pool-size: 3
      minimum-idle: 1
